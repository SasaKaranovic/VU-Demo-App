name: Build VU1 Demo App

# Build check for every push (and manual runs). The built app is kept as a workflow artifact.
# Releases are built by build_release.yml.
on:
  push:
  workflow_dispatch:

env:
  PROJECT: VU1WPF/VU1WPF.csproj
  PUBLISH_DIR: publish

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore $env:PROJECT

    - name: Publish
      run: dotnet publish $env:PROJECT --configuration Release --no-restore --self-contained false --output $env:PUBLISH_DIR

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: VU1-Demo-App-${{ github.sha }}
        path: ${{ env.PUBLISH_DIR }}/*
        if-no-files-found: error

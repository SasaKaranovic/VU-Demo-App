name: Build release

# Runs when a GitHub release is published (Releases > Draft a new release > Publish).
# Builds the app, creates the installer and attaches both to the release.
# Can also be started manually from the Actions tab (artifacts only, nothing is attached).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed to upload files to the release

env:
  PROJECT: VU1WPF/VU1WPF.csproj
  PUBLISH_DIR: publish
  ARTIFACTS_DIR: artifacts
  DOTNET_RUNTIME_EXE: windowsdesktop-runtime-10.0-win-x64.exe   # must match DOTNET_RUNTIME_EXE in installer/install.nsi

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Release tag "v2.1.0" -> version 2.1.0 (used for the assembly version and file names)
    - name: Determine version
      id: version
      run: |
        $tag = "${{ github.event.release.tag_name }}"
        if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "manual-$(Get-Date -Format yyyyMMdd)-${{ github.run_number }}" }
        $version = $tag -replace '^[vV]', ''
        $msbuildVersion = ''
        if ($version -match '^\d+(\.\d+){1,3}$') { $msbuildVersion = "-p:Version=$version" }
        "tag=$tag"                       >> $env:GITHUB_OUTPUT
        "version=$version"               >> $env:GITHUB_OUTPUT
        "msbuild_version=$msbuildVersion" >> $env:GITHUB_OUTPUT
        Write-Host "Tag: $tag  Version: $version"

    - name: Restore
      run: dotnet restore $env:PROJECT

    - name: Publish
      run: >
        dotnet publish $env:PROJECT
        --configuration Release
        --no-restore
        --self-contained false
        --output $env:PUBLISH_DIR
        ${{ steps.version.outputs.msbuild_version }}

    - name: Create zip
      run: |
        New-Item -ItemType Directory -Force -Path $env:ARTIFACTS_DIR | Out-Null
        $zip = "$env:ARTIFACTS_DIR/VU1-Demo-App-${{ steps.version.outputs.version }}.zip"
        Compress-Archive -Path "$env:PUBLISH_DIR/*" -DestinationPath $zip -Force
        Write-Host "Created $zip"

    # The installer bundles the .NET Desktop Runtime, download the latest 10.0.x
    - name: Download .NET Desktop Runtime
      run: |
        Invoke-WebRequest -Uri "https://aka.ms/dotnet/10.0/windowsdesktop-runtime-win-x64.exe" `
                          -OutFile "installer/inc/$env:DOTNET_RUNTIME_EXE"
        Get-Item "installer/inc/$env:DOTNET_RUNTIME_EXE" | Select-Object Name, Length

    - name: Install NSIS
      run: |
        if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
        }

    - name: Build installer
      run: |
        $installer = "${{ github.workspace }}\$env:ARTIFACTS_DIR\VU1-Demo-App-${{ steps.version.outputs.version }}-Setup.exe"
        $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
        if (-not $makensis) { $makensis = "C:\Program Files (x86)\NSIS\makensis.exe" }
        & $makensis "/DINSTALLEROUTPUT=$installer" `
                    "/DDIRDIST=${{ github.workspace }}\$env:PUBLISH_DIR" `
                    "/DDIRSOURCE=${{ github.workspace }}" `
                    "${{ github.workspace }}\installer\install.nsi"
        if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

    # Always keep the build output on the workflow run (Actions tab > run > Artifacts)
    - name: Upload workflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VU1-Demo-App-${{ steps.version.outputs.version }}
        path: ${{ env.ARTIFACTS_DIR }}/*
        if-no-files-found: error

    # Attach the zip and installer to the GitHub release
    - name: Attach to release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $files = Get-ChildItem $env:ARTIFACTS_DIR -File | ForEach-Object { $_.FullName }
        gh release upload "${{ github.event.release.tag_name }}" $files --clobber --repo "${{ github.repository }}"
